<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CompraHost</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17202a;--muted:#6b7280;--dark:#111827;--green:#1f7a5a;--line:#e5e7eb;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.app{min-height:100dvh;display:grid;grid-template-columns:230px 1fr}aside{background:var(--dark);color:#fff;padding:22px 15px}.brand{font-size:21px;font-weight:800;margin:4px 8px 24px}nav{display:grid;gap:8px}.nav{border:0;border-radius:12px;padding:13px 14px;background:transparent;color:#d1d5db;text-align:left;font-weight:700}.nav.active{background:#1f2937;color:#fff}main{padding:30px;max-width:1000px;width:100%;margin:auto}h1{margin:0 0 4px}.sub{color:var(--muted);margin-bottom:22px}.view{display:none}.view.active{display:block}.primary,.secondary,.small{border:0;border-radius:11px;padding:11px 14px;font-weight:750}.primary{background:var(--green);color:#fff}.secondary,.small{background:#fff;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}.card,.row,.empty{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.famhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.famhead h3{margin:0}.subs{display:grid;gap:8px;margin-top:12px}.subrow{background:#f8fafc;border-radius:10px;padding:10px 11px;display:flex;justify-content:space-between}.danger{border:0;background:transparent;color:var(--red)}.empty{text-align:center;color:var(--muted);border-style:dashed}.list{display:grid;gap:10px;padding-bottom:90px}.row{display:flex;align-items:center;gap:12px}.row input{width:20px;height:20px;accent-color:var(--green)}.row .name{flex:1;font-weight:700}.row.done .name{text-decoration:line-through;color:#9ca3af}.fab{position:fixed;right:26px;bottom:24px;width:60px;height:60px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:34px;box-shadow:0 10px 28px #1f7a5a55}dialog{border:0;border-radius:18px;padding:0;width:min(92vw,450px)}dialog::backdrop{background:#11182777}.modal{padding:21px}.modal h2{margin:0 0 5px}.modal p,.hint{color:var(--muted)}label{font-size:13px;font-weight:750}.field{display:grid;gap:7px;margin:16px 0}.withmic{display:grid;grid-template-columns:1fr 48px;gap:8px}input[type=text]{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:11px}.mic{border:1px solid var(--line);background:#fff;border-radius:11px;font-size:20px}.mic.listening{background:#fee2e2}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}@media(max-width:720px){.app{grid-template-columns:1fr}aside{position:sticky;top:0;z-index:4;padding:10px;display:flex;align-items:center}.brand{font-size:17px;margin:0 8px}nav{margin-left:auto;display:flex}.nav{padding:10px;font-size:14px}main{padding:22px 15px 100px}}
</style>
</head>
<body>
<div class="app"><aside><div class="brand">CompraHost</div><nav><button class="nav active" data-view="inventory">📦 Inventario</button><button class="nav" data-view="purchases">🛒 Compras</button></nav></aside><main>
<section id="inventory" class="view active"><h1>Inventario</h1><div class="sub">Familias y subfamilias de producto.</div><button class="primary" id="addFamily">+ Agregar familia</button><div id="families" class="grid"></div></section>
<section id="purchases" class="view"><h1>Compras</h1><div class="sub">Añade rápidamente lo que necesitas comprar.</div><div id="purchaseList" class="list"></div><button class="fab" id="addProduct" aria-label="Agregar producto">+</button></section>
</main></div>
<dialog id="familyDlg"><form method="dialog" class="modal"><h2>Nueva familia</h2><p>Ejemplo: Carne, Bebidas, Limpieza...</p><div class="field"><label>Nombre</label><input id="familyName" type="text" placeholder="Carne"></div><div class="actions"><button class="secondary" value="cancel">Cancelar</button><button class="primary" id="saveFamily">Guardar</button></div></form></dialog>
<dialog id="subDlg"><form method="dialog" class="modal"><h2>Nueva subfamilia</h2><p id="subLabel"></p><div class="field"><label>Nombre</label><input id="subName" type="text" placeholder="Churrasco cerdo"></div><div class="actions"><button class="secondary" value="cancel">Cancelar</button><button class="primary" id="saveSub">Guardar</button></div></form></dialog>
<dialog id="productDlg"><form method="dialog" class="modal"><h2>Agregar producto</h2><p>Escribe el producto o pulsa el micrófono para dictarlo.</p><div class="field"><label>Producto</label><div class="withmic"><input id="productName" type="text" placeholder="Ej. 3 kg de picaña"><button type="button" class="mic" id="micBtn">🎙️</button></div><div class="hint" id="micHint">Puedes usar el dictado del teléfono.</div></div><div class="actions"><button class="secondary" value="cancel">Cancelar</button><button class="primary" id="saveProduct">Agregar</button></div></form></dialog>
<script>
const KEY='comprahost-v1',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state)state={families:[{id:uid(),name:'Carne',subfamilies:[{id:uid(),name:'Churrasco cerdo'}]}],purchases:[]};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.view).classList.add('active')});
function renderFamilies(){const el=document.getElementById('families');if(!state.families.length){el.innerHTML='<div class="empty">Todavía no hay familias.</div>';return}el.innerHTML=state.families.map(f=>`<article class="card"><div class="famhead"><h3>${esc(f.name)}</h3><button class="small" onclick="openSub('${f.id}')">+ Subfamilia</button></div><div class="subs">${f.subfamilies.length?f.subfamilies.map(s=>`<div class="subrow"><span>${esc(s.name)}</span><button class="danger" onclick="deleteSub('${f.id}','${s.id}')">✕</button></div>`).join(''):'<span class="hint">Sin subfamilias.</span>'}</div><button class="danger" style="margin-top:13px" onclick="deleteFamily('${f.id}')">Eliminar familia</button></article>`).join('')}
function renderPurchases(){const el=document.getElementById('purchaseList');if(!state.purchases.length){el.innerHTML='<div class="empty">No hay productos pendientes. Pulsa + para añadir uno.</div>';return}el.innerHTML=state.purchases.map(p=>`<div class="row ${p.done?'done':''}"><input type="checkbox" ${p.done?'checked':''} onchange="togglePurchase('${p.id}')"><div class="name">${esc(p.name)}</div><button class="danger" onclick="deletePurchase('${p.id}')">✕</button></div>`).join('')}
const familyDlg=document.getElementById('familyDlg'),subDlg=document.getElementById('subDlg'),productDlg=document.getElementById('productDlg');let currentFamily=null;
addFamily.onclick=()=>{familyName.value='';familyDlg.showModal();setTimeout(()=>familyName.focus(),50)};saveFamily.onclick=e=>{const n=familyName.value.trim();if(!n){e.preventDefault();return}state.families.push({id:uid(),name:n,subfamilies:[]});save();renderFamilies()};
window.openSub=id=>{currentFamily=id;const f=state.families.find(x=>x.id===id);subLabel.textContent='Dentro de: '+f.name;subName.value='';subDlg.showModal()};saveSub.onclick=e=>{const n=subName.value.trim();if(!n){e.preventDefault();return}state.families.find(x=>x.id===currentFamily).subfamilies.push({id:uid(),name:n});save();renderFamilies()};window.deleteFamily=id=>{if(confirm('¿Eliminar esta familia y sus subfamilias?')){state.families=state.families.filter(x=>x.id!==id);save();renderFamilies()}};window.deleteSub=(fid,sid)=>{const f=state.families.find(x=>x.id===fid);f.subfamilies=f.subfamilies.filter(x=>x.id!==sid);save();renderFamilies()};
addProduct.onclick=()=>{productName.value='';productDlg.showModal();setTimeout(()=>productName.focus(),50)};saveProduct.onclick=e=>{const n=productName.value.trim();if(!n){e.preventDefault();return}state.purchases.unshift({id:uid(),name:n,done:false});save();renderPurchases()};window.togglePurchase=id=>{const p=state.purchases.find(x=>x.id===id);p.done=!p.done;save();renderPurchases()};window.deletePurchase=id=>{state.purchases=state.purchases.filter(x=>x.id!==id);save();renderPurchases()};
window.receiveVoiceText=t=>{productName.value=productName.value?productName.value+' '+t:t;micBtn.classList.remove('listening');micHint.textContent='Dictado finalizado. Puedes corregirlo antes de agregar.'};
micBtn.onclick=()=>{if(window.Android&&Android.startVoiceInput){micBtn.classList.add('listening');micHint.textContent='Escuchando…';Android.startVoiceInput()}else{micHint.textContent='El dictado nativo está disponible al instalar la app Android.'}};
renderFamilies();renderPurchases();
</script>
</body></html>
